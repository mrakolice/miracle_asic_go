services:
  postgres:
    image: postgres:latest
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      -

  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    ports:
      - "9092:9092"

  asics: {}
  auth: {}
  parsers: {}
  api_gateway: {}

volumes:
  postgres_data: